# Publishes @makinuki/pdk to npm when a vX.Y.Z tag lands on master.
# Authentication uses npm Trusted Publishing (OIDC); the package must
# list this repository and workflow filename in its Trusted Publisher
# settings on npmjs.com. No NPM_TOKEN secret is required or used.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm publish --access public --provenance --no-git-checks
